name: macOS ARM64 build

on:
  pull_request:
  push:
    branches: [main, mac]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure macOS ARM64 Release
        run: cmake --preset mac-arm64-vcpkg
      - name: Build macOS ARM64 Release
        run: cmake --build --preset mac-arm64-vcpkg --parallel 3
      - name: Test match reports
        run: ctest --test-dir build/mac-arm64-vcpkg --output-on-failure
      - name: Check executable and staged assets
        shell: bash
        run: |
          lipo build/mac-arm64-vcpkg/gameplayfootball -verify_arch arm64
          test -f build/mac-arm64-vcpkg/football.config
          test -d build/mac-arm64-vcpkg/databases
          test -d build/mac-arm64-vcpkg/media
